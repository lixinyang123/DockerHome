apiVersion: apps/v1
kind: Deployment
metadata:
  name: corehome-admin
  namespace: default
  labels:
    name: corehome-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      name: corehome-admin
  template:
    metadata:
      labels:
        name: corehome-admin
    spec:
      restartPolicy: Always
      containers:
        - name: corehome-admin
          image: lixinyang/corehome.admin
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - mountPath: /app/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
            - mountPath: /app/data
              name: data

      volumes:
        - configMap:
            name: corehome-appsettings
          name: appsettings
        - name: data
          hostPath:
            path: /var/lib/corehome
            type: DirectoryOrCreate

---

apiVersion: v1
kind: Service
metadata:
  labels:
    name: corehome-admin
  name: corehome-admin
  namespace: default
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    name: corehome-admin
  type: ClusterIP
